name: RAG-E CI
on:
  workflow_dispatch:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12", enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - run: uv sync --frozen --extra dev --extra milvus --extra evaluation
        working-directory: backend
      - run: uv run ruff check app tests && uv run ruff format --check app tests
        working-directory: backend
      - run: uv run pytest -q --cov=app --cov-report=term-missing
        working-directory: backend
      - run: uv run python ../scripts/check_publication.py
        working-directory: backend
      - run: cp .env.example .env && docker compose --profile milvus config --quiet
      - run: docker build -f backend/Dockerfile . -t rag-e-backend:ci
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: docker build -f frontend/Dockerfile . -t rag-e-frontend:ci
  graph-integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env: { NEO4J_AUTH: "neo4j/rag-e-local-neo4j" }
        ports: ["7687:7687"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474"
          --health-interval 10s --health-retries 30 --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: uv run pytest -q tests/test_graph_external.py tests/test_security_external.py
        working-directory: backend
        env:
          RAGE_TEST_NEO4J_URI: bolt://localhost:7687
          RAGE_TEST_REDIS_URL: redis://localhost:6379/0
