[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuum-backend"
version = "1.0.0"
description = "Knowledge- and Memory-Driven Platform for Long-Horizon Multimodal Agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.135.2,<0.136", "uvicorn[standard]>=0.34,<0.43",
  "pydantic-settings>=2.13,<3", "sqlalchemy>=2.0.48,<2.1",
  "alembic>=1.18,<2", "httpx>=0.28,<0.29", "langgraph>=1.1.9,<1.2",
  "PyJWT>=2.10,<3", "python-multipart>=0.0.22,<0.1",
  "prometheus-client>=0.21,<1", "redis>=5,<8", "psycopg[binary]>=3.2,<4",
  "neo4j>=6.0,<7", "langfuse>=4,<5",
  "cryptography>=46,<51",
  "Pillow>=12.3,<13", "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
milvus = ["pymilvus>=2.6.9,<2.7"]
local-models = ["sentence-transformers>=5,<6"]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
evaluation = [
    "matplotlib>=3.9,<4",
    "ir-measures>=0.4,<1",
    "pyarrow>=18",
    "rouge-score>=0.1.2,<0.2",
    "pyahocorasick>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["external: requires explicitly configured external services"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
