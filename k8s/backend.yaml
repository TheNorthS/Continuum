apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: rag-e }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      terminationGracePeriodSeconds: 180
      containers:
        - name: backend
          image: rag-e-backend:1.0.0
          ports: [{ containerPort: 8000 }]
          volumeMounts: [{ name: encryption, mountPath: /run/rag-e-secrets, readOnly: true }]
          envFrom:
            - configMapRef: { name: rag-e-config }
            - secretRef: { name: rag-e-secrets }
          startupProbe: { httpGet: { path: /api/v1/health/live, port: 8000 }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /api/v1/health/ready, port: 8000 }, periodSeconds: 10, timeoutSeconds: 12 }
          livenessProbe: { httpGet: { path: /api/v1/health/live, port: 8000 }, periodSeconds: 20, timeoutSeconds: 3 }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 10001, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
      securityContext: { fsGroup: 10001 }
      volumes: [{ name: encryption, secret: { secretName: rag-e-encryption, defaultMode: 288 } }]
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: rag-e }
spec: { selector: { app: backend }, ports: [{ port: 8000, targetPort: 8000 }] }
