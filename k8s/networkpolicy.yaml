apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: data-internal-only, namespace: rag-e }
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [postgres, redis, neo4j] }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: {} }]
      ports: [{ port: 5432 }, { port: 6379 }, { port: 7687 }]
