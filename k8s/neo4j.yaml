apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: neo4j-data, namespace: rag-e }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: neo4j, namespace: rag-e }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: neo4j } }
  template:
    metadata: { labels: { app: neo4j } }
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.26-community
          ports: [{ containerPort: 7687 }, { containerPort: 7474 }]
          env:
            - name: NEO4J_AUTH
              valueFrom: { secretKeyRef: { name: rag-e-secrets, key: NEO4J_AUTH } }
            - { name: NEO4J_server_memory_heap_max__size, value: 512m }
            - { name: NEO4J_server_memory_pagecache_size, value: 256m }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /, port: 7474 }, initialDelaySeconds: 30, periodSeconds: 10 }
          resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: neo4j-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: neo4j, namespace: rag-e }
spec: { selector: { app: neo4j }, ports: [{ name: bolt, port: 7687, targetPort: 7687 }] }
